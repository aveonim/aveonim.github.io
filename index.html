<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aveonim</title>
  <style>
    :root {
      --bg: #121316;
      --card: #1c1e24;
      --text: #f0f2f5;
      --sub: #9ba1b0;
      --accent: #b83a4b; /* 아버님 버건디 가디건 톤 */
      --border: #2e323b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 28px;
    }

    .contact {
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .email {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .email:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <main class="card">
    <img src="profile.png" alt="Aveonim" class="avatar">
    <h1>Aveonim</h1>
    <span class="status">Coffee Time ☕</span>

    <div class="contact">
      <a href="mailto:aveonim.cane@gmail.com" class="email">aveonim.cane@gmail.com</a>
    </div>
  </main>

</body>
</html>
